  quality:
    name: Typecheck, Unit, Build and Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      AUTH_MODE: dev
      PERSISTENCE_MODE: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: API tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Browser smoke tests
        run: npm run test:smoke

  dependency-security:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --omit=optional
