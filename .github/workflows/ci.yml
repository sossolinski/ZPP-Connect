name: CI

on:
  pull_request:
  push:

jobs:
  foundation-postgres:
    name: Foundation PostgreSQL Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zpp
          POSTGRES_PASSWORD: zpp
          POSTGRES_DB: zpp_connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zpp -d zpp_connect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      AUTH_MODE: dev
      PERSISTENCE_MODE: postgres
      DATABASE_URL: postgresql://zpp:zpp@127.0.0.1:5432/zpp_connect_test?schema=public
      TEST_DATABASE_URL: postgresql://zpp:zpp@127.0.0.1:5432/zpp_connect_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client and shared package
        run: |
          npm run db:generate
          npm run build -w @zpp/shared

      - name: Fresh database migration
        run: npm run prisma:deploy -w @zpp/api

      - name: Seed database
        run: npm run prisma:seed -w @zpp/api

      - name: Build API for startup gate
        run: |
          npm run build -w @zpp/shared
          npm run build -w @zpp/api

      - name: Start production Entra API against PostgreSQL
        run: |
          NODE_ENV=production AUTH_MODE=entra PERSISTENCE_MODE=postgres \
          ENTRA_ISSUER=https://login.microsoftonline.com/test/v2.0 \
          ENTRA_AUDIENCE=zpp-connect-ci ENTRA_JWKS_URI=https://example.test/jwks \
          DATA_DIR="$RUNNER_TEMP/zpp-connect-storage" \
          node apps/api/dist/src/index.js > api-startup.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            sed -n '1,240p' api-startup.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:4000/api/health
          auth_config=$(curl --fail --silent http://127.0.0.1:4000/api/auth/config)
          node -e 'const config = JSON.parse(process.argv[1]); if (config.developmentAccessEnabled !== false || JSON.stringify(config.authenticationMethods) !== JSON.stringify(["MICROSOFT_SSO"])) process.exit(1)' "$auth_config"
          dev_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4000/api/auth/development/users)
          test "$dev_status" = "404"
          kill "$api_pid"
          wait "$api_pid" || true

      - name: PostgreSQL Foundation Stage 1 through 21 integration tests (zero skipped)
        run: npm run test:postgres

      - name: Dedicated Foundation Stage 18 PostgreSQL tests
        run: npm exec -w @zpp/api vitest run -- --no-file-parallelism --maxWorkers=1 src/foundation-stage18-postgres.integration.test.ts

      - name: Dedicated Foundation Stage 19 PostgreSQL tests
        run: npm exec -w @zpp/api vitest run -- --no-file-parallelism --maxWorkers=1 src/foundation-stage19-postgres.integration.test.ts

      - name: Dedicated Foundation Stage 20 PostgreSQL tests
        run: npm exec -w @zpp/api vitest run -- --no-file-parallelism --maxWorkers=1 src/foundation-stage20-postgres.integration.test.ts

      - name: Dedicated Foundation Stage 21 PostgreSQL tests
        run: npm exec -w @zpp/api vitest run -- --no-file-parallelism --maxWorkers=1 src/foundation-stage21-postgres.integration.test.ts

      - name: Install Chromium for Stage 16 through 21 workflow coverage
        run: npx playwright install --with-deps chromium

      - name: Stage 16 PostgreSQL browser workflow
        env:
          PLAYWRIGHT_PERSISTENCE_MODE: postgres
        run: npx playwright test tests/smoke/zz-stage16-imports.spec.ts

      - name: Stage 17 PostgreSQL browser workflow
        env:
          PLAYWRIGHT_PERSISTENCE_MODE: postgres
        run: npx playwright test tests/smoke/zz-stage17-exports.spec.ts

      - name: Stage 18 PostgreSQL browser workflow
        env:
          PLAYWRIGHT_PERSISTENCE_MODE: postgres
        run: npx playwright test tests/smoke/zz-stage18-exercise.spec.ts

      - name: Stage 19 PostgreSQL browser workflow
        env:
          PLAYWRIGHT_PERSISTENCE_MODE: postgres
        run: npx playwright test tests/smoke/zz-stage19-readiness.spec.ts

      - name: Stage 21 PostgreSQL browser workflow
        env:
          PLAYWRIGHT_PERSISTENCE_MODE: postgres
        run: npx playwright test tests/smoke/zz-stage21-admin-configuration.spec.ts

      - name: Rehearse exact Stage 20 to Stage 21 dictionary authority migration
        env:
          PGPASSWORD: zpp
          BACKFILL_DATABASE_URL: postgresql://zpp:zpp@127.0.0.1:5432/zpp_backfill_test?schema=public
          BACKFILL_PSQL_URL: postgresql://zpp:zpp@127.0.0.1:5432/zpp_backfill_test
        run: |
          createdb --host=127.0.0.1 --username=zpp zpp_backfill_test
          migration_workspace=$(mktemp -d)
          trap 'dropdb --if-exists --host=127.0.0.1 --username=zpp zpp_backfill_test; rm -rf "$migration_workspace"' EXIT
          cp apps/api/prisma/schema.prisma "$migration_workspace/schema.prisma"
          mkdir -p "$migration_workspace/migrations"
          cp apps/api/prisma/migrations/migration_lock.toml "$migration_workspace/migrations/migration_lock.toml"
          cp -R apps/api/prisma/migrations/20260701000000_baseline "$migration_workspace/migrations/"
          cp -R apps/api/prisma/migrations/20260712090000_assignment_identity "$migration_workspace/migrations/"
          DATABASE_URL="$BACKFILL_DATABASE_URL" npx prisma migrate deploy --schema "$migration_workspace/schema.prisma"
          psql "$BACKFILL_PSQL_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "User" ("id", "email", "displayName", "status", "updatedAt")
          VALUES ('10000000-0000-4000-8000-000000000001', 'backfill@example.test', 'Backfill Test', 'active', CURRENT_TIMESTAMP);
          INSERT INTO "Session" ("id", "operationalId", "mode", "status", "eventType", "createdById", "updatedAt")
          VALUES ('20000000-0000-4000-8000-000000000001', 'BACKFILL-001', 'TRAINING', 'Draft', 'Backfill test', '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP);
          INSERT INTO "PassengerRecord" (
            "id", "operationalId", "sessionId", "personType", "firstName", "lastName", "source",
            "conditionStatus", "holdStatus", "srcConfirmed", "createdById", "updatedById", "updatedAt"
          ) VALUES (
            '30000000-0000-4000-8000-000000000001', 'PAX-BACKFILL-001',
            '20000000-0000-4000-8000-000000000001', 'Passenger', 'Historical', 'Passenger', 'Manifest',
            'Unknown', 'No hold', true, '10000000-0000-4000-8000-000000000001',
            '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP
          );
          INSERT INTO "FamilyRecord" (
            "id", "operationalId", "sessionId", "firstName", "lastName", "phone", "email",
            "claimedRelationship", "verificationStatus", "verificationNotes", "createdById", "updatedById", "updatedAt"
          ) VALUES (
            '40000000-0000-4000-8000-000000000001', 'FAM-BACKFILL-001',
            '20000000-0000-4000-8000-000000000001', 'Historical', 'Claimant', '+48 600 300 300',
            'HISTORICAL@EXAMPLE.TEST', 'Sibling', 'Verified', 'Historical evidence reviewed',
            '10000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP
          );
          SQL
          cp -R apps/api/prisma/migrations/20260804000000_enquiry_incident_isolation "$migration_workspace/migrations/"
          cp -R apps/api/prisma/migrations/20260804010000_incident_assignment_lifecycle "$migration_workspace/migrations/"
          cp -R apps/api/prisma/migrations/20260804020000_passenger_persistence_source_integrity "$migration_workspace/migrations/"
          cp -R apps/api/prisma/migrations/20260805020000_family_relationship_claims "$migration_workspace/migrations/"
          DATABASE_URL="$BACKFILL_DATABASE_URL" npx prisma migrate deploy --schema "$migration_workspace/schema.prisma"
          assignment_count=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "IncidentAssignment" WHERE "incidentId" = '\''20000000-0000-4000-8000-000000000001'\'' AND "userId" = '\''10000000-0000-4000-8000-000000000001'\'' AND active = true;')
          test "$assignment_count" = "1"
          passenger_backfill=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "PassengerRecord" WHERE "id" = '\''30000000-0000-4000-8000-000000000001'\'' AND "version" = 1 AND "sourceImportedAt" IS NOT NULL AND "srcConfirmedAt" IS NOT NULL;')
          test "$passenger_backfill" = "1"
          family_backfill=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "FamilyRecord" family JOIN "RelationshipClaim" claim ON claim."familyRecordId" = family."id" AND claim."isCurrent" = true JOIN "RelationshipVerificationDecision" decision ON decision."relationshipClaimId" = claim."id" WHERE family."id" = '\''40000000-0000-4000-8000-000000000001'\'' AND family."version" = 1 AND family."normalizedEmail" = '\''historical@example.test'\'' AND claim."status" = '\''VERIFIED'\'' AND decision."result" = '\''VERIFIED'\'';')
          test "$family_backfill" = "1"
          psql "$BACKFILL_PSQL_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "MatchingRecord" (
            "id", "operationalId", "sessionId", "familyRecordId", "passengerRecordId", "status",
            "matchScore", "matchBasis", "holdCheck", "decisionNotes", "approvedById", "approvedAt",
            "createdById", "updatedById", "updatedAt"
          ) VALUES (
            '50000000-0000-4000-8000-000000000001', 'MAT-BACKFILL-001',
            '20000000-0000-4000-8000-000000000001', '40000000-0000-4000-8000-000000000001',
            '30000000-0000-4000-8000-000000000001', 'Verified match', 0.87,
            'Historical operator-reviewed match', 'No hold', 'Historical human decision',
            '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP,
            '10000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP
          );
          SQL
          cp -R apps/api/prisma/migrations/20260805030000_matching_suggestions_decisions "$migration_workspace/migrations/"
          DATABASE_URL="$BACKFILL_DATABASE_URL" npx prisma migrate deploy --schema "$migration_workspace/schema.prisma"
          matching_backfill=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "MatchingRecord" matching JOIN "MatchSuggestion" suggestion ON suggestion."id" = matching."suggestionId" JOIN "MatchDecision" decision ON decision."matchingRecordId" = matching."id" JOIN "RelationshipClaim" claim ON claim."id" = matching."relationshipClaimId" WHERE matching."id" = '\''50000000-0000-4000-8000-000000000001'\'' AND suggestion."algorithm" = '\''legacy-matching-record'\'' AND suggestion."algorithmVersion" = '\''legacy-v1'\'' AND decision."decision" = '\''CONFIRMED'\'' AND decision."isCurrent" = true AND decision."claimVersion" = claim."version";')
          test "$matching_backfill" = "1"
          psql "$BACKFILL_PSQL_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "ReunificationReleaseRecord" (
            "id", "operationalId", "sessionId", "matchId", "passengerRecordId", "familyRecordId",
            "actionType", "status", "receivingParty", "identityChecked", "holdCleared",
            "authorizedById", "completedById", "completedAt", "notes", "updatedAt"
          ) VALUES (
            '60000000-0000-4000-8000-000000000001', 'REL-BACKFILL-001',
            '20000000-0000-4000-8000-000000000001', '50000000-0000-4000-8000-000000000001',
            '30000000-0000-4000-8000-000000000001', '40000000-0000-4000-8000-000000000001',
            'Release', 'Completed', 'Historical receiving party', true, true,
            '10000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000001',
            CURRENT_TIMESTAMP, 'Historical shortcut state without independent evidence', CURRENT_TIMESTAMP
          );
          SQL
          cp -R apps/api/prisma/migrations/20260806010000_release_actions_checks "$migration_workspace/migrations/"
          DATABASE_URL="$BACKFILL_DATABASE_URL" npx prisma migrate deploy --schema "$migration_workspace/schema.prisma"
          release_backfill=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "ReleaseAction" action WHERE action."id" = '\''60000000-0000-4000-8000-000000000001'\'' AND action."status" = '\''COMPLETED'\'' AND action."actionType" = '\''RELEASE'\'' AND action."legacyImported" = true AND action."verificationEvidenceUnavailable" = true AND action."preparedById" = '\''10000000-0000-4000-8000-000000000001'\'' AND NOT EXISTS (SELECT 1 FROM "ReleaseCheck" check_record WHERE check_record."releaseActionId" = action."id");')
          test "$release_backfill" = "1"
          psql "$BACKFILL_PSQL_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Session" ("id", "operationalId", "mode", "status", "eventType", "createdById", "updatedAt")
          VALUES ('20000000-0000-4000-8000-000000000002', 'BACKFILL-002', 'REAL', 'Draft', 'Cross-incident backfill test', '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP);
          INSERT INTO "PassengerRecord" (
            "id", "operationalId", "sessionId", "personType", "firstName", "lastName", "source",
            "conditionStatus", "holdStatus", "srcConfirmed", "createdById", "updatedById", "updatedAt"
          ) VALUES (
            '30000000-0000-4000-8000-000000000002', 'PAX-BACKFILL-002',
            '20000000-0000-4000-8000-000000000002', 'Passenger', 'Cross', 'Incident', 'Manifest',
            'Unknown', 'No hold', false, '10000000-0000-4000-8000-000000000001',
            '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP
          );
          INSERT INTO "WelfareRequest" (
            "id", "operationalId", "sessionId", "caseId", "relatedEnquiryId", "relatedFamilyRecordId",
            "relatedPassengerRecordId", "category", "priority", "requester", "ownerAssignedTo", "details",
            "approvalStatus", "status", "closureNote", "notes", "createdById", "updatedById", "createdAt", "updatedAt"
          ) VALUES (
            '70000000-0000-4000-8000-000000000001', 'REQ-BACKFILL-001',
            '20000000-0000-4000-8000-000000000001', 'CASE-BACKFILL', NULL,
            '40000000-0000-4000-8000-000000000001', '30000000-0000-4000-8000-000000000001',
            'Transport', 'Urgent', 'Historical requester', 'Unknown historical owner',
            'Historical transport need', 'Not required', 'Closed', 'Historical closure note',
            'No transition history existed', '10000000-0000-4000-8000-000000000001',
            '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP - INTERVAL '2 days', CURRENT_TIMESTAMP - INTERVAL '1 day'
          );
          INSERT INTO "WelfareRequest" (
            "id", "operationalId", "sessionId", "relatedPassengerRecordId", "category", "priority",
            "details", "approvalStatus", "status", "createdById", "updatedById", "updatedAt"
          ) VALUES (
            '70000000-0000-4000-8000-000000000002', 'REQ-BACKFILL-002',
            '20000000-0000-4000-8000-000000000001', '30000000-0000-4000-8000-000000000002',
            'Other', 'Normal', 'Legacy cross-incident reference', 'Not required', 'Open',
            '10000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP
          );
          SQL
          cp -R apps/api/prisma/migrations/20260806020000_requests_foundation "$migration_workspace/migrations/"
          DATABASE_URL="$BACKFILL_DATABASE_URL" npx prisma migrate deploy --schema "$migration_workspace/schema.prisma"
          request_backfill=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "WelfareRequest" request WHERE request."id" = '\''70000000-0000-4000-8000-000000000001'\'' AND request."status" = '\''RESOLVED'\'' AND request."priority" = '\''Urgent'\'' AND request."ownerUserId" IS NULL AND request."ownerAssignedTo" = '\''Unknown historical owner'\'' AND request."relatedFamilyRecordId" = '\''40000000-0000-4000-8000-000000000001'\'' AND request."relatedPassengerRecordId" = '\''30000000-0000-4000-8000-000000000001'\'' AND request."legacyImported" = true AND request."resolvedAt" = request."updatedAt" AND request."legacyMetadata"->>'\''transitionHistoryUnavailable'\'' = '\''true'\'' AND NOT EXISTS (SELECT 1 FROM "RequestOperation" operation WHERE operation."requestRecordId" = request."id");')
          test "$request_backfill" = "1"
          request_cross_incident=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "WelfareRequest" request WHERE request."id" = '\''70000000-0000-4000-8000-000000000002'\'' AND request."relatedPassengerRecordId" IS NULL AND request."legacyMetadata"->>'\''legacyRelatedPassengerRecordId'\'' = '\''30000000-0000-4000-8000-000000000002'\'' AND request."legacyMetadata"->>'\''crossIncidentPassengerLinkRemoved'\'' = '\''true'\'';')
          test "$request_cross_incident" = "1"
          psql "$BACKFILL_PSQL_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "User" ("id", "email", "displayName", "status", "updatedAt") VALUES
            ('10000000-0000-4000-8000-000000000002', 'ambiguous-one@example.test', 'Ambiguous Legacy', 'active', CURRENT_TIMESTAMP),
            ('10000000-0000-4000-8000-000000000003', 'ambiguous-two@example.test', 'Ambiguous Legacy', 'active', CURRENT_TIMESTAMP);
          INSERT INTO "AssignmentTask" (
            "id", "operationalId", "sessionId", "title", "status", "priority", "ownerAssignedTo",
            "assignedUserDisplayName", "assignedUserId", "createdById", "updatedById", "updatedAt"
          ) VALUES
            ('80000000-0000-4000-8000-000000000001', 'ASN-BACKFILL-001', '20000000-0000-4000-8000-000000000001',
             'Unique historical owner', 'In Progress', 'Urgent', 'Backfill Test', 'Backfill Test', NULL,
             '10000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP - INTERVAL '3 hours'),
            ('80000000-0000-4000-8000-000000000002', 'ASN-BACKFILL-002', '20000000-0000-4000-8000-000000000001',
             'Ambiguous historical owner', 'Open', 'Normal', 'Ambiguous Legacy', 'Ambiguous Legacy', NULL,
             '10000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP - INTERVAL '2 hours'),
            ('80000000-0000-4000-8000-000000000003', 'ASN-BACKFILL-003', '20000000-0000-4000-8000-000000000001',
             'Historical terminal task', 'Completed', 'Critical', 'Backfill Test', 'Backfill Test', '10000000-0000-4000-8000-000000000001',
             '10000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP - INTERVAL '1 hour'),
            ('80000000-0000-4000-8000-000000000004', 'ASN-BACKFILL-004', '20000000-0000-4000-8000-000000000001',
             'Unknown historical enums', 'Legacy status', 'Legacy priority', NULL, NULL, NULL,
             '10000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000001', CURRENT_TIMESTAMP);
          SQL
          cp -R apps/api/prisma/migrations/20260809000000_assignment_tasks_foundation "$migration_workspace/migrations/"
          DATABASE_URL="$BACKFILL_DATABASE_URL" npx prisma migrate deploy --schema "$migration_workspace/schema.prisma"
          assignment_unique_owner=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "AssignmentTask" WHERE "id" = '\''80000000-0000-4000-8000-000000000001'\'' AND "assignedUserId" = '\''10000000-0000-4000-8000-000000000001'\'' AND "legacyAssigneeLabel" IS NULL AND "legacyImported" = true AND "version" = 1;')
          test "$assignment_unique_owner" = "1"
          assignment_ambiguous_owner=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "AssignmentTask" WHERE "id" = '\''80000000-0000-4000-8000-000000000002'\'' AND "assignedUserId" IS NULL AND "legacyAssigneeLabel" = '\''Ambiguous Legacy'\'' AND "legacyImported" = true;')
          test "$assignment_ambiguous_owner" = "1"
          assignment_terminal=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "AssignmentTask" WHERE "id" = '\''80000000-0000-4000-8000-000000000003'\'' AND "status" = '\''Completed'\'' AND "completedAt" = "updatedAt" AND "completedById" IS NULL AND "legacyMetadata"->>'\''terminalTimestampDerivedFromUpdatedAt'\'' = '\''true'\'';')
          test "$assignment_terminal" = "1"
          assignment_unknown_enums=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "AssignmentTask" WHERE "id" = '\''80000000-0000-4000-8000-000000000004'\'' AND "status" = '\''Open'\'' AND "priority" = '\''Normal'\'' AND "legacyMetadata"->>'\''historicalStatus'\'' = '\''Legacy status'\'' AND "legacyMetadata"->>'\''historicalPriority'\'' = '\''Legacy priority'\'';')
          test "$assignment_unknown_enums" = "1"
          assignment_synthetic_operations=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "AssignmentOperation" WHERE "assignmentTaskId" IN ('\''80000000-0000-4000-8000-000000000001'\'', '\''80000000-0000-4000-8000-000000000002'\'', '\''80000000-0000-4000-8000-000000000003'\'', '\''80000000-0000-4000-8000-000000000004'\'');')
          test "$assignment_synthetic_operations" = "0"
          cp -R apps/api/prisma/migrations/20260809010000_operational_id_concurrency_closure "$migration_workspace/migrations/"
          DATABASE_URL="$BACKFILL_DATABASE_URL" npx prisma migrate deploy --schema "$migration_workspace/schema.prisma"
          operational_id_sequences=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM pg_class WHERE relkind = '\''S'\'' AND relname IN ('\''Session_operational_seq'\'', '\''Enquiry_operational_seq'\'');')
          test "$operational_id_sequences" = "2"
          cp -R apps/api/prisma/migrations/20260810000000_member_profiles_groups_foundation "$migration_workspace/migrations/"
          DATABASE_URL="$BACKFILL_DATABASE_URL" npx prisma migrate deploy --schema "$migration_workspace/schema.prisma"
          member_group_tables=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM information_schema.tables WHERE table_schema = '\''public'\'' AND table_name IN ('\''MemberProfile'\'', '\''OperationalGroup'\'', '\''GroupMembership'\'', '\''GroupRoleAssignment'\'');')
          test "$member_group_tables" = "4"
          member_group_sequences=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM pg_class WHERE relkind = '\''S'\'' AND relname IN ('\''MemberProfile_id_seq'\'', '\''MemberProfile_business_seq'\'', '\''OperationalGroup_id_seq'\'', '\''GroupMembership_id_seq'\'');')
          test "$member_group_sequences" = "4"
          cp -R apps/api/prisma/migrations/20260810100000_rostering_availability_foundation "$migration_workspace/migrations/"
          DATABASE_URL="$BACKFILL_DATABASE_URL" npx prisma migrate deploy --schema "$migration_workspace/schema.prisma"
          rostering_tables=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM information_schema.tables WHERE table_schema = '\''public'\'' AND table_name IN ('\''RosterShift'\'', '\''Availability'\'', '\''RosteringOperation'\'');')
          test "$rostering_tables" = "3"
          rostering_sequences=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM pg_class WHERE relkind = '\''S'\'' AND relname IN ('\''RosterShift_operational_seq'\'', '\''Availability_operational_seq'\'');')
          test "$rostering_sequences" = "2"
          synthetic_rostering_operations=$(psql "$BACKFILL_PSQL_URL" --tuples-only --no-align --command='SELECT count(*) FROM "RosteringOperation";')
          test "$synthetic_rostering_operations" = "0"
          cp -R apps/api/prisma/migrations/20260810110000_training_foundation "$migration_workspace/migrations/"
          DATABASE_URL="$BACKFILL_DATABASE_URL" npx prisma migrate deploy --schema "$migration_workspace/schema.prisma"
