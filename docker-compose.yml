services:
  postgres:
    image: postgres:16-alpine
    container_name: zpp-connect-postgres
    environment:
      POSTGRES_USER: zpp
      POSTGRES_PASSWORD: zpp
      POSTGRES_DB: zpp_connect
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zpp -d zpp_connect"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zpp-connect-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://zpp:zpp@postgres:5432/zpp_connect?schema=public
      PERSISTENCE_MODE: postgres
      API_PORT: 4000
      APP_ORIGIN: http://localhost:5173
      AUTH_MODE: dev
      DEV_USER_EMAIL: coordinator@lot.pl
      DATA_DIR: /app/storage
    ports:
      - "4000:4000"
    volumes:
      - app-storage:/app/storage
    command: sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npm run prisma:seed -w @zpp/api && node apps/api/dist/src/index.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: zpp-connect-web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres-data:
  app-storage:
